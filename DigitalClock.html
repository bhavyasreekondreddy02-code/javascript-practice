<html>
<head> Digital Clock</head>
<body>
<h1 id ="dc"> </h1 id ="dc">
</body>
<script>
    function showtime()
    {
        let date = new Date();
        let h = date.getHours();
        let m = date.getMinutes();
        let s = date.getSeconds();

        let session ="AM";
        //convert 12hr format
        if(h == 0){
            h = 12; //midnight

        }
        else if(h>12)
        {
            h = h - 12;
            session ="PM";
            
        }

        // Add leading zeros
        h = (h < 10) ? "0" + h : h;
        m = (m < 10) ? "0" + m : m;
        s = (s < 10) ? "0" + s : s;

        let time = h+":"+m+":"+s+" "+session;
        document.getElementById("dc").innerHTML=time;
        setTimeout(showtime,1000);

    }
    showtime();

</script>
</html>
